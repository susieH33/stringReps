name: Instructor Grading - Pset 3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out submission
        uses: actions/checkout@v4
        with:
          path: submission
          persist-credentials: false

      - name: Load instructor grading notebook
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: instructor-grading
          path: instructor
          sparse-checkout: grading/pset3-review.ipynb
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare grading notebook
        run: |
          mkdir -p submission/grading
          cp instructor/grading/pset3-review.ipynb submission/grading/pset3-review.ipynb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install nbconvert ipykernel

      - name: Execute grading notebook
        working-directory: submission
        run: |
          jupyter nbconvert --to notebook --execute --allow-errors \
            --ExecutePreprocessor.timeout=120 \
            grading/pset3-review.ipynb \
            --output pset3-results.ipynb --output-dir grading

      - name: Check grading results
        working-directory: submission
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          notebook = json.loads(Path("grading/pset3-results.ipynb").read_text())
          errors = [
              output
              for cell in notebook["cells"]
              for output in cell.get("outputs", [])
              if output.get("output_type") == "error"
          ]
          for error in errors:
              print(f"{error['ename']}: {error['evalue']}")
          if errors:
              raise SystemExit("Grading notebook contains errors; see the results artifact.")
          PYTHON

      - name: Save grading results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pset3-results
          path: submission/grading/pset3-results.ipynb
          if-no-files-found: ignore
